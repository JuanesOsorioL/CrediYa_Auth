server:
  port: ${SERVER_PORT:8080}
adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:auth}
    schema: ${DB_SCHEMA:public}
    username: ${DB_USER:creditUserData}
    password: ${DB_PASS:za4iLVvR8qVq4yQv}
spring:

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USER:creditUserData}
    password: ${DB_PASS:za4iLVvR8qVq4yQv}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth}

    user: ${DB_USER:creditUserData}
    password: ${DB_PASS:za4iLVvR8qVq4yQv}

    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
    locations: classpath:db/migration


  application:
    name: "CrediYa_Auth"

  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://localhost:8083}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: WARN
    co.com.crediya.logger.logger.GlobalLogger: INFO

routes:
  user:
    base: /api/v1/usuarios
    document: /api/v1/document
    login: /api/v1/login
    validateToken: /api/v1/validateToken
    allUsers: /api/v1/usuarios/allUsers
    someUsers: /api/v1/map

jwt:
  secret: ${JWT_SECRET:yW9kMHFmQmQzUGxwM0NnNGcyZ1kzZzdXwqGZz/GePgs=}
  expiration: ${JWT_EXPIRATION:3600000}