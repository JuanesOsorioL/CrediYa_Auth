server:
  port: ${SERVER_PORT}
adapters:
  r2dbc:
    host: ${DB_HOST}
    port: ${DB_PORT}
    database: ${DB_NAME}
    schema: ${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASS}
spring:

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASS}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

    user: ${DB_USER}
    password: ${DB_PASS}

    schemas: ${DB_SCHEMA}
    default-schema: ${DB_SCHEMA}
    locations: classpath:db/migration


  application:
    name: "CrediYa_Auth"

  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: WARN
    co.com.crediya.logger.logger.GlobalLogger: INFO

routes:
  user:
    base: /api/v1/usuarios
    document: /api/v1/document
    login: /api/v1/login
    validateToken: /api/v1/validateToken
    allUsers: /api/v1/usuarios/allUsers
    someUsers: /api/v1/map

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}